<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Marhey:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>style</title>
  </head>

  <body>
    <h1>This is my new Website</h1>
    <div class="text">
      <p>I dont know for what tho. But I like the style so far.</p>
      <p>Do you?</p>
    </div>
    <div class="buttons">
      <button id="showLove" style="margin-top: 0">Love it!</button>
      <button id="noLove" style="margin-top: 0">Hell no.</button>
    </div>
    <div class="text" id="Love" style="display: none; margin-top: 5pt">
      <p>Yeah, me too.</p>
      <p>Do you want to play a game?</p>
      <div class="buttons">
        <button id="play">Yes please!</button>
        <button id="noPlay">Not interested.</button>
      </div>
    </div>
    <div class="text" id="games" style="display: none">
      <p>How about some Chocolate?</p>
      <a href="https://aloso.github.io/chocolate/" target="_blank">
        Play Aloso's cool Chocolate Game
      </a>
      <p>Or you can think of a number and I will try to guess it!</p>
      <a href="./guess-a-number/">Pick a number between 1 and 1000</a>
    </div>
    <div id="why" style="display: none">Why?</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
